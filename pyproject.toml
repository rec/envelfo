[project]
name = "envelfo"
version = "0.1.0"
description = "Reusable envelopes, LFOs, and event-driven control signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["ufor"]

[project.optional-dependencies]
midi = ["middy"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "ty",
    "pyupgrade",
    "reccy>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
middy = { git = "ssh://git@github.com/rec/middy.git", rev = "50049c0c02f137fc312c324cee8271364f4a0e61" }
ufor = { git = "https://github.com/rec/ufor", branch = "main" }
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto --dist=worksteal"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"
