[project]
name = "envelfo"
version = "0.1.0"
description = "Reusable envelopes, LFOs, and event-driven control signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["ufor"]

[dependency-groups]
dev = ["pytest", "pytest-xdist", "ruff", "ty", "pyupgrade"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ufor = { git = "https://github.com/rec/ufor", branch = "main" }
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto --dist=worksteal"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"
