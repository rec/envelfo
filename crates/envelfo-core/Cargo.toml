[package]
name = "envelfo-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Exact control playback without Python or an audio engine"
license = "MIT"

[dependencies]
num-rational = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10.9"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
